name: Keep Supabase Alive

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Supabase health endpoint
        run: |
          echo "Pinging Supabase health endpoint..."
          curl -X GET "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -w "\nHTTP Status: %{http_code}\n"
          
      - name: Ping Supabase Auth endpoint
        run: |
          echo "Pinging Supabase Auth endpoint..."
          curl -X GET "${{ secrets.SUPABASE_URL }}/auth/v1/user" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -w "\nHTTP Status: %{http_code}\n"
