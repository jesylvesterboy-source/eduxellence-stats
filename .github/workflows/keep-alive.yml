name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours (4 times a day)
  workflow_dispatch:  # Allows manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API to keep Supabase active
        run: |
          echo "Pinging Hugging Face API health endpoint..."
          curl -X GET "https://Eduxellence-eduxellence-api.hf.space/health" \
            -w "\nHTTP Status: %{http_code}\n" \
            --fail-with-body
