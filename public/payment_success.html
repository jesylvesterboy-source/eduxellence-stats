<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Payment — Eduxellence</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F7F9FC;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
.card{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(11,24,41,.1);
  padding:2.5rem 2rem;max-width:380px;width:100%;text-align:center}
.icon{font-size:2.5rem;margin-bottom:1rem}
h1{color:#0B1829;font-size:1.2rem;margin-bottom:.5rem}
p{color:#64748B;font-size:.9rem;line-height:1.5}
.balance{font-size:1.4rem;font-weight:700;color:#1E6BFF;margin:1rem 0}
.spinner{width:28px;height:28px;border:3px solid #E2E8F0;border-top-color:#1E6BFF;
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
a.btn{display:inline-block;margin-top:1.25rem;padding:.7rem 1.5rem;background:#1E6BFF;color:#fff;
  border-radius:10px;text-decoration:none;font-weight:600;font-size:.9rem}
</style></head>
<body>
<div class="card" id="card">
  <div class="spinner"></div>
  <h1>Confirming your payment…</h1>
  <p>This only takes a moment.</p>
</div>

<script>
// ============================================================
// API_BASE — this page is served from Vercel (stats.eduxellence.org)
// but the API lives on the Hugging Face Space. Every call must be
// an absolute URL against the HF Space.
// ============================================================
const API_BASE = (() => {
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    return 'http://localhost:7860';
  }
  return 'https://eduxellence-eduxellence-api.hf.space';
})();

function render(html) { document.getElementById('card').innerHTML = html; }

async function getValidToken() {
  const expiresAt = parseInt(localStorage.getItem('edux_token_expires_at') || '0', 10);
  const token = localStorage.getItem('edux_auth_token');
  if (!token) return null;

  if (Date.now() < expiresAt - 2 * 60 * 1000) {
    return token;
  }

  const refreshToken = localStorage.getItem('edux_refresh_token');
  if (!refreshToken) return token; // fall back to the (possibly stale) token; server will reject if truly expired

  try {
    const r = await fetch(`${API_BASE}/api/auth/refresh`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({refresh_token: refreshToken})
    });
    const d = await r.json();
    if (d.access_token) {
      localStorage.setItem('edux_auth_token', d.access_token);
      localStorage.setItem('edux_refresh_token', d.refresh_token);
      localStorage.setItem('edux_token_expires_at', String(Date.now() + (d.expires_in || 3600) * 1000));
      return d.access_token;
    }
  } catch (e) {
    console.error('Token refresh failed:', e);
  }
  return token;
}

async function confirmPayment() {
  const token = await getValidToken();
  if (!token) {
    render(`<div class="icon">🔒</div><h1>Please sign in</h1><p>We couldn't find your session. Sign in to see your updated balance.</p><a class="btn" href="/login">Sign In</a>`);
    return;
  }

  const params = new URLSearchParams(window.location.search);
  let gateway, reference, transaction_id;

  if (params.get('trxref') || (params.get('reference') && !params.get('tx_ref'))) {
    gateway = 'paystack';
    reference = params.get('reference') || params.get('trxref');
  } else if (params.get('tx_ref')) {
    gateway = 'flutterwave';
    reference = params.get('tx_ref');
    transaction_id = params.get('transaction_id');
  } else {
    render(`<div class="icon">⚠️</div><h1>No payment details found</h1><p>If you just completed a purchase, check your balance below.</p><a class="btn" href="/pricing">Back to Pricing</a>`);
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/api/payments/verify-and-credit`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify({gateway, reference, transaction_id})
    });
    const data = await res.json();

    if (res.ok && data.ok) {
      const balanceLine = data.balance !== undefined ? data.balance : data.new_balance;
      render(`<div class="icon">✅</div><h1>Payment confirmed</h1>
        <p>Your credits have been added.</p>
        <div class="balance">💎 ${balanceLine} credits</div>
        <a class="btn" href="/stats">Start Analyzing</a>`);
    } else {
      render(`<div class="icon">⚠️</div><h1>We couldn't confirm this automatically</h1>
        <p>${data.error || 'Please contact support with your payment reference.'}</p>
        <p style="margin-top:.5rem;font-size:.75rem;color:#94A3B8">Reference: ${reference}</p>
        <a class="btn" href="/pricing">Back to Pricing</a>`);
    }
  } catch (e) {
    render(`<div class="icon">⚠️</div><h1>Network error</h1><p>Please refresh this page.</p>`);
  }
}

confirmPayment();
</script>
</body></html>
