<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Successful - Eduxellence</title>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #F7F9FC;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.14);
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: #E8F5E9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .icon svg {
            width: 48px;
            height: 48px;
            fill: none;
            stroke: #16A34A;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #0F172A;
            margin: 0 0 8px 0;
        }
        p {
            color: #64748B;
            font-size: 16px;
            margin: 0 0 24px 0;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #1E6BFF;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }
        .btn:hover {
            background: #1557D9;
        }
        .note {
            margin-top: 16px;
            color: #94A3B8;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
        </div>
        <h1>Payment Successful! 🎉</h1>
        <p>Your credits have been added to your account. You can now run advanced statistical analyses.</p>
        <a href="/stats" class="btn">Go to Analysis</a>
        <p class="note">Your credits should appear in your dashboard shortly.</p>
    </div>
</body>
</html>
