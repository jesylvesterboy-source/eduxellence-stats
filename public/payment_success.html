<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Successful - Eduxellence</title>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #F7F9FC;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.14);
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: #E8F5E9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .icon svg {
            width: 48px;
            height: 48px;
            fill: none;
            stroke: #16A34A;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #0F172A;
            margin: 0 0 8px 0;
        }
        p {
            color: #64748B;
            font-size: 16px;
            margin: 0 0 24px 0;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #1E6BFF;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }
        .btn:hover {
            background: #1557D9;
        }
        .note {
            margin-top: 16px;
            color: #94A3B8;
            font-size: 13px;
        }
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1E6BFF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
        </div>
        <h1>Payment Successful! 🎉</h1>
        <p id="status-message">Your credits have been added to your account. You can now run advanced statistical analyses.</p>
        <div class="loader" id="loader"></div>
        <a href="/stats" class="btn">Go to Analysis</a>
        <p class="note">Your credits should appear in your dashboard shortly. If not, please contact support.</p>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const status = params.get('status');
            const txRef = params.get('tx_ref');
            const transactionId = params.get('transaction_id');

            console.log('Payment success page loaded:', { status, txRef, transactionId });

            // If we have transaction details, we could verify with server
            if (status === 'successful' && txRef) {
                // Optionally call /api/payments/verify endpoint here
                // For now, just show success
                document.getElementById('status-message').textContent = 
                    'Your payment was successful! Your credits have been added to your account.';
            }
        })();
    </script>
</body>
</html>
